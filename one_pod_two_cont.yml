apiVersion: v1
kind: pod
metadata:
  name: one-pod-two-containers
  labels:
    app: multi-container-app
spec:
  containers:
    - name: nginx-container
      image: nginx:latest
      ports:
        - containerPort: 80
    - name: BusyBox-container
      image: busybox:latest
      command: ["sh", "-c", "while true: do echo 'Hello from BusyBox'; sleep 5; done"]


