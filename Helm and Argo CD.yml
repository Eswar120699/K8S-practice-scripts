#Install Helm
curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3.sh
chmod 700 get_helm.sh
./get_helm.sh
helm version

#Install Argo CD
helm repo add argo https://argoproj.github.io/argo-helm
helm repo update
kubectl create namespace argocd
helm install argocd argo/argo-cd -n argocd
kubectl get pods -n argocd
kubectl get all -n argocd #to check all the resources created by argocd namespace
kubectl patch svc argocd-server -n argocd -p '{"spec": {"type": "LoadBalancer"}}' #to expose the argocd server using load balancer
kubectl get svc -n argocd #to get the load balancer dns name
#take load balancer dns name and access the argocd server using the dns name, use the default username admin and password is the name of the argocd-server pod or admin.
kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d; echo #to get the password of argocd server

#login to argocd server using the load balancer dns name, username and password. and create a new application in argocd using github link https://github.com/ReyazShaik/ar-deploy.git
#project name, application name as hdfc bank, sync policy as automatic, source repo url, path ./ ,cluster url default it will get, namespace default - create now
#now automatically the application will be deployed in the cluster, you can check the application status in argocd server and also you can check the resources created in the cluster using kubectl get all command.
kubectl get pods
